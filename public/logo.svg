<svg viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
    </marker>
  </defs>

  <!-- Y axis -->
  <line x1="60" y1="90" x2="60" y2="10" stroke="black" stroke-width="2.5" marker-end="url(#arrow)" />
  <!-- X axis -->
  <line x1="50" y1="80" x2="350" y2="80" stroke="black" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Sine Wave -->
  <!-- A wider and taller sine wave -->
  <!-- Starts at (60, 80), goes up to (130, 20), crosses at (200, 80), goes down to (270, 140), ends at (340, 80) -->
  <path d="M 60 80 C 95 10, 165 10, 200 80 C 235 150, 305 150, 340 80" fill="none" stroke="black" stroke-width="3" />

  <!-- Dots on the axes like in the image (optional) -->
  
  <!-- Text -->
  <text x="200" y="140" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="32" text-anchor="middle" fill="#000000">
    <tspan>Periyot</tspan>
    <tspan font-weight="900">LAB</tspan>
  </text>
</svg>
